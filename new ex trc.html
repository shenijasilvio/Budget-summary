<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income and Expense Tracker</title>
    <style>
        /* Reset styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body styling */
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Ensure content starts from the top */
            min-height: 100vh;
            padding: 20px; /* Add some padding around the page */
            margin: 0; /* Remove default margin */
        }

        /* Main container styling */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 450px;
            text-align: center;
            box-sizing: border-box;
        }

        /* Heading styling */
        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #3b82f6;
        }

        /* Form section styling */
        .form-section {
            background-color: #f8fafc;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* Form heading */
        h2 {
            font-size: 22px;
            color: #4b5563;
            margin-bottom: 15px;
        }

        /* Form input fields styling */
        input, select, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="number"]:focus, input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        /* Button styling */
        button {
            background-color: #3b82f6;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            background-color: #2563eb;
        }

        /* Transaction History Section */
        .history {
            margin-top: 30px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background-color: #f3f4f6;
            color: #374151;
            font-weight: 600;
        }

        td {
            font-size: 16px;
            color: #6b7280;
        }

        /* Budget Summary Section */
        .summary {
            margin-top: 20px;
            background-color: #f8fafc;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .summary p {
            font-size: 18px;
            margin: 10px 0;
            font-weight: 500;
        }

        #clear-all {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #clear-all:hover {
            background-color: #dc2626;
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container {
                width: 90%;
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            h2 {
                font-size: 18px;
            }

            input, select, button {
                font-size: 14px;
                padding: 10px;
            }

            #clear-all {
                padding: 10px 18px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Income and Expense Tracker</h1>

        <!-- Income Form -->
        <div class="form-section">
            <h2>Add Income</h2>
            <form id="income-form">
                <input type="text" id="income-description" placeholder="Description" required>
                <input type="number" id="income-amount" placeholder="Amount" required>
                <button type="submit">Add Income</button>
            </form>
        </div>

        <!-- Expense Form -->
        <div class="form-section">
            <h2>Add Expense</h2>
            <form id="expense-form">
                <input type="text" id="expense-description" placeholder="Description" required>
                <select id="expense-category">
                    <option value="housing">Housing</option>
                    <option value="food">Food</option>
                    <option value="transportation">Transportation</option>
                    <option value="utilities">Utilities</option>
                    <option value="entertainment">Entertainment</option>
                </select>
                <input type="number" id="expense-amount" placeholder="Amount" required>
                <button type="submit">Add Expense</button>
            </form>
        </div>

        <!-- Transaction History -->
        <div class="history">
            <h2>Transaction History</h2>
            <table id="transaction-history">
                <thead>
                    <tr>
                        <th>Description</th>
                        <th>Amount</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- Budget Summary -->
        <div class="summary">
            <h2>Budget Summary</h2>
            <p>Total Income: $<span id="total-income">0</span></p>
            <p>Total Expenses: $<span id="total-expenses">0</span></p>
            <p>Balance: $<span id="balance">0</span></p>
            <button id="clear-all">Clear All</button>
        </div>
    </div>

    <script>
        // Variables
        const incomeForm = document.getElementById('income-form');
        const expenseForm = document.getElementById('expense-form');
        const incomeDescriptionInput = document.getElementById('income-description');
        const incomeAmountInput = document.getElementById('income-amount');
        const expenseDescriptionInput = document.getElementById('expense-description');
        const expenseCategorySelect = document.getElementById('expense-category');
        const expenseAmountInput = document.getElementById('expense-amount');
        const transactionHistoryTable = document.getElementById('transaction-history').getElementsByTagName('tbody')[0];
        const totalIncomeSpan = document.getElementById('total-income');
        const totalExpensesSpan = document.getElementById('total-expenses');
        const balanceSpan = document.getElementById('balance');
        const clearAllButton = document.getElementById('clear-all');

        let totalIncome = 0;
        let totalExpenses = 0;
        let transactions = [];

        // Add Income
        incomeForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const description = incomeDescriptionInput.value;
            const amount = parseFloat(incomeAmountInput.value);

            if (description && !isNaN(amount) && amount > 0) {
                // Add income transaction
                const transaction = {
                    type: 'Income',
                    description: description,
                    amount: amount
                };
                transactions.push(transaction);
                totalIncome += amount;

                // Update UI
                updateTransactionHistory();
                updateSummary();

                // Reset form
                incomeDescriptionInput.value = '';
                incomeAmountInput.value = '';
            }
        });

        // Add Expense
        expenseForm.addEventListener('submit', (event) => {
            event.preventDefault();

            const description = expenseDescriptionInput.value;
            const category = expenseCategorySelect.value;
            const amount = parseFloat(expenseAmountInput.value);

            if (description && !isNaN(amount) && amount > 0) {
                // Add expense transaction
                const transaction = {
                    type: 'Expense',
                    description: description,
                    category: category,
                    amount: amount
                };
                transactions.push(transaction);
                totalExpenses += amount;

                // Update UI
                updateTransactionHistory();
                updateSummary();

                // Reset form
                expenseDescriptionInput.value = '';
                expenseAmountInput.value = '';
            }
        });

        // Update Transaction History
        function updateTransactionHistory() {
            // Clear existing history
            transactionHistoryTable.innerHTML = '';

            // Loop through transactions and display them
            transactions.forEach((transaction) => {
                const row = document.createElement('tr');
                const descriptionCell = document.createElement('td');
                const amountCell = document.createElement('td');

                descriptionCell.textContent = transaction.description;
                amountCell.textContent = `$${transaction.amount.toFixed(2)}`;

                row.appendChild(descriptionCell);
                row.appendChild(amountCell);

                transactionHistoryTable.appendChild(row);
            });
        }

        // Update Budget Summary
        function updateSummary() {
            totalIncomeSpan.textContent = totalIncome.toFixed(2);
            totalExpensesSpan.textContent = totalExpenses.toFixed(2);
            balanceSpan.textContent = (totalIncome - totalExpenses).toFixed(2);
        }

        // Clear All Data
        clearAllButton.addEventListener('click', () => {
            transactions = [];
            totalIncome = 0;
            totalExpenses = 0;

            // Reset UI
            updateTransactionHistory();
            updateSummary();
        });
    </script>
</body>
</html>
